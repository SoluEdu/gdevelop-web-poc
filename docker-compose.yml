services:
  # ── Node — serve dist + POST /api/github/import (OPFS tetap di browser) ──
  # CONTAINER_NAME / FULL_IMAGE diisi Jenkins via .env (fallback lokal)
  app:
    image: ${FULL_IMAGE:-gdevelop-app}
    container_name: ${CONTAINER_NAME:-gdevelop-app}
    restart: always
    expose:
      - "${CONTAINER_PORT:-80}"
    env_file:
      - .env
    networks:
      - palpatrol

  # ── Nginx — reverse proxy 80 → app:80 (image baked via Dockerfile.nginx) ──
  # NGINX_IMAGE diisi Jenkins via .env (fallback lokal)
  # 443 aktif via rebuild image setelah uncomment block 443 di nginx/nginx.conf
  web:
    image: ${NGINX_IMAGE:-gdevelop-nginx}
    container_name: ${CONTAINER_NAME:-gdevelop-app}-web
    restart: always
    depends_on:
      - app
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-18530}:${CONTAINER_PORT:-80}"
    networks:
      - palpatrol

networks:
  palpatrol:
    name: palpatrol
    external: true
