server {

   listen 80;

   location / {
     root   /usr/share/nginx/html/app/dist;
     index  index.html index.htm;
     try_files $uri $uri/ /index.html;
   }

   error_page   500 502 503 504  /50x.html;

   location = /50x.html {
     root   /usr/share/nginx/html/app/dist;
   }
 }


 server {

   listen 443 ssl;

   server_name 192.168.35.7;
   location / {
     root   /usr/share/nginx/html/app/dist;
     index  index.html index.htm;
     try_files $uri $uri/ /index.html;
   }

   ssl_certificate /etc/nginx/ssl/gdevelop.crt;
   ssl_certificate_key /etc/nginx/ssl/gdevelop.key;
 
#   ssl_certificate /etc/nginx/ssl/emitama.crt;
#   ssl_certificate_key /etc/nginx/ssl/emitama.key;
   
   include /etc/nginx/ssl/ssl-params.conf;
   error_page   500 502 503 504  /50x.html;

   location = /50x.html {
     root   /usr/share/nginx/html/app/dist;
   }
 }
