server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ==============================================
    # Health check endpoint
    # Dipakai oleh Docker HEALTHCHECK & Jenkins Health Check stage.
    # Tidak butuh akses ke file system app, cukup balas 200 OK.
    # ==============================================
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # ==============================================
    # SPA routing (Vue Router history mode)
    # Semua route yang tidak match file statis diarahkan ke index.html
    # ==============================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==============================================
    # Caching untuk asset hasil build (biasanya sudah ada hash di nama file)
    # ==============================================
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Tidak perlu cache untuk index.html supaya update selalu ke-load
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
