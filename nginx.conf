# Opsi B — Nginx sebagai reverse proxy di depan Node (server.mjs)
# Node (app:80) tetap handle /api/github/import + static + /health
# Nginx handle 80/443, SSL terminasi, dan proxy ke app

upstream app_upstream {
    server app:80;
}

# ── HTTP (80) ─────────────────────────────────────────────────────────
server {
    listen       80;
    server_name  _;

    # Health — proxy ke Node agar cek app tetap valid
    location = /health {
        proxy_pass http://app_upstream/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # API GitHub import — wajib proxy ke Node (jangan dilayani sebagai file)
    location /api/ {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # stream upload/download ZIP
        proxy_request_buffering off;
        proxy_http_version 1.1;
        client_max_body_size 550m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA + static — proxy ke Node (server.mjs sudah handle SPA fallback & cache header)
    location / {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}

# ── HTTPS (443) — aktif jika cert tersedia, fallback ke 80 jika tidak ─
server {
    listen              443 ssl;
    server_name         192.168.35.7;

    ssl_certificate     /etc/nginx/ssl/gdevelop.crt;
    ssl_certificate_key /etc/nginx/ssl/gdevelop.key;
    # include /etc/nginx/ssl/ssl-params.conf; # uncomment jika file ada

    # health via https juga
    location = /health {
        proxy_pass http://app_upstream/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        client_max_body_size 550m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
